<section id="portfolio" class="portfolio-section">
  <div class="portfolio-grid-overlay"></div>
  <div class="portfolio-orb portfolio-orb-1"></div>
  <div class="portfolio-orb portfolio-orb-2"></div>
  <div class="portfolio-container" #portfolioContainer>
    <div class="section-header">
      <div class="section-eyebrow">
        <span class="eyebrow-line"></span>
        <span class="eyebrow-text">My Work</span>
        <span class="eyebrow-line"></span>
      </div>
      <h2 class="section-title">Featured <span class="accent">Projects</span></h2>
      <p class="section-subtitle">Production systems & personal builds</p>
    </div>
    <div class="filter-tabs">
      <button class="filter-btn" *ngFor="let tab of filterTabs"
        [class.active]="activeFilter === tab.value" (click)="setFilter(tab.value)">
        {{ tab.label }}
      </button>
    </div>
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of filteredProjects; let i = index"
        [style.animation-delay]="(i * 0.1) + 's'">
        <div class="card-image-wrap">
          <img [src]="project.image" [alt]="project.name" class="card-image" />
          <div class="card-image-overlay">
            <div class="overlay-links">
              <a *ngIf="project.github" [href]="project.github" target="_blank" class="overlay-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                GitHub
              </a>
              <a *ngIf="project.live" [href]="project.live" target="_blank" class="overlay-btn overlay-btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
                Live
              </a>
            </div>
          </div>
          <div class="card-type-badge">{{ project.type }}</div>
        </div>
        <div class="card-body">
          <div class="card-body-header">
            <h3 class="project-name">{{ project.name }}</h3>
            <span class="project-year">{{ project.year }}</span>
          </div>
          <p class="project-desc">{{ project.description }}</p>
          <div class="project-tags">
            <span class="proj-tag" *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>
        </div>
        <div class="card-footer">
          <div class="project-meta">
            <span class="meta-item">
              <span class="meta-dot" [class.professional]="project.category === 'professional'" [class.personal]="project.category === 'personal'"></span>
              {{ project.category === 'professional' ? 'Professional' : 'Personal' }}
            </span>
            <div class="card-links">
              <a *ngIf="project.github" [href]="project.github" target="_blank" class="card-link" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="portfolio-stats">
      <div class="pstat" *ngFor="let stat of portfolioStats">
        <span class="pstat-num">{{ stat.value }}</span>
        <span class="pstat-label">{{ stat.label }}</span>
      </div>
    </div>
  </div>
</section>
