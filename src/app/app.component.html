<!-- Loading Overlay -->
<div class="loading-overlay" [class.hide]="!isLoading">
  <div class="loading-logo-wrap" [class.fly]="logoFlying">
    <img src="assets/images/Logo.png" alt="LR Logo" class="loading-logo" />
  </div>
</div>

<!-- Main App — starts invisible, fades in after loading -->
<div class="app-wrapper" [class.visible]="!isLoading">
  <app-header></app-header>
  <main class="main-content">
    <app-home></app-home>
    <app-about></app-about>
    <app-portfolio></app-portfolio>
    <app-service></app-service>
    <app-contact></app-contact>
  </main>
</div>
